# Dependency updates as pull requests, each Monday. Minor and patch updates
# come grouped, one pull request per ecosystem, so they read in one go. A new
# version waits 14 days before it is offered, time for a broken release to be
# found by others. Security fixes come on their own as soon as they are out.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Paris
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    # must be the version the WebView2 bindings use, it moves with Tauri
    ignore:
      - dependency-name: windows-core
    groups:
      rust:
        update-types: [minor, patch]

  # pnpm workspace: the root lockfile covers every package
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Paris
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    groups:
      npm:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Paris
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ['*']

  # the server image's build and base images
  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Paris
    cooldown:
      default-days: 14
    # node's odd majors are never long-term support: move up by hand
    ignore:
      - dependency-name: node
        update-types: ['version-update:semver-major']
    groups:
      docker:
        patterns: ['*']
