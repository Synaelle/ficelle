name: codeql

# GitHub's code scanning, for each stable release that raises the middle
# number (vX.Y.0), and by hand. Not on every push: it takes long and slowed
# the work down. It is free for public repositories only.

on:
  push:
    tags: ['v[0-9]+.[0-9]+.0']
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript, rust]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          # tests use fixed keys and passwords on purpose, and the dev tools
          # never ship
          config: |
            paths-ignore:
              - '**/*_tests.rs'
              - '**/tests.rs'
              - '**/tests/**'
              - '**/*.test.ts'
              - crates/repo/src/testing.rs
              - crates/devtool/**
              - tools/dev-server.mjs
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
