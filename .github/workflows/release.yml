name: release

# A release, from its tag: the Windows, Linux and Android apps built at
# once, each signed for the app updater with the TAURI_SIGNING_PRIVATE_KEY
# secret, attached to a draft release with one latest.json for all, and
# only then published. Until then the release is a draft, which neither
# people nor apps see; a failed build leaves it a draft.
#
# The draft can be made beforehand, with its notes and the servers' signed
# releases.json; a tag pushed without one gets a plain draft, its notes
# edited on GitHub before running this again.

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - name: the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          state=$(gh api "repos/$GH_REPO/releases" --paginate \
            --jq ".[] | select(.tag_name == \"$TAG\") | if .draft then \"draft\" else \"published\" end" | head -1)
          case "$state" in
            draft) echo "draft $TAG is there" ;;
            published)
              echo "::error::$TAG is published already, nothing is built over it"
              exit 1 ;;
            *)
              gh release create "$TAG" --draft --verify-tag --title "$TAG" --notes "$TAG"
              echo "made a plain draft for $TAG" ;;
          esac

  windows:
    needs: draft
    uses: ./.github/workflows/windows.yml
    with:
      signed: true
    secrets: inherit

  linux:
    needs: draft
    uses: ./.github/workflows/linux.yml
    with:
      signed: true
    secrets: inherit

  android:
    needs: draft
    uses: ./.github/workflows/android.yml
    with:
      signed: true
    secrets: inherit

  publish:
    needs: [windows, linux, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: out
      - name: latest.json, the files, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          version="${TAG#v}"
          base="https://github.com/$GH_REPO/releases/download/$TAG"
          setup=$(find out -name '*-setup.exe' | head -1)
          portable=$(find out -name '*_portable.exe' | head -1)
          appimage=$(find out -name '*.AppImage' | head -1)
          apk=$(find out -name '*.apk' | head -1)
          for file in "$setup" "$portable" "$appimage" "$apk"; do test -f "$file"; done
          # the line servers show, from the signed releases.json on the draft
          # and whether it fixes a security problem: apps then ask in the
          # middle of the screen, a critical update
          notes=""
          critical=false
          if gh release download "$TAG" -p releases.json -O releases.json --clobber 2>/dev/null; then
            notes=$(jq -r --arg v "$version" '.releases[] | select(.version == $v) | .notes // ""' releases.json)
            critical=$(jq --arg v "$version" '[.releases[] | select(.version == $v) | .security == true] | any' releases.json)
          fi
          entry() { jq -n --arg sig "$(cat "$1.sig")" --arg url "$base/$(basename "$1")" '{signature: $sig, url: $url}'; }
          # the one APK holds every Android architecture, listed under each
          jq -n --arg version "$version" --arg notes "$notes" --argjson critical "$critical" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson windows "$(entry "$setup")" \
            --argjson linux "$(entry "$appimage")" \
            --argjson android "$(entry "$apk")" \
            '{version: $version, notes: $notes, critical: $critical, pub_date: $date, platforms: {
              "windows-x86_64": $windows, "linux-x86_64": $linux,
              "android-aarch64": $android, "android-arm": $android, "android-x86_64": $android }}' \
            > latest.json
          cat latest.json
          # the signatures travel in latest.json, not on the release page
          gh release upload "$TAG" "$setup" "$portable" "$appimage" "$apk" latest.json --clobber
          gh release edit "$TAG" --draft=false --latest
          echo "published $TAG"
