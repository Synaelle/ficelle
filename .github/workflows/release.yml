name: release

# A release, from its tag: the Windows, Linux and Android apps built at
# once, each signed for the app updater with the TAURI_SIGNING_PRIVATE_KEY
# secret, attached to a draft release with one latest.json for all, and
# only then published. Until then the release is a draft, which neither
# people nor apps see; a failed build leaves it a draft.
#
# The draft can be made beforehand, with its notes and the servers'
# releases.json, which releases-list.yml signs here; a tag pushed without one
# gets a plain draft, its notes edited on GitHub before running this again.
#
# Two channels. A stable tag vX.Y.Z becomes the latest release, the list
# stable apps read (releases/latest/download/latest.json). A beta tag
# vX.Y.Z-beta.N is a pre-release, never "latest". Beta apps read the list
# of the fixed "beta" release, which always holds the newest of either
# kind: every release newer than what it holds replaces it, so a beta app
# reaches the stable release too.

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+', 'v[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - name: the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          state=$(gh api "repos/$GH_REPO/releases" --paginate \
            --jq ".[] | select(.tag_name == \"$TAG\") | if .draft then \"draft\" else \"published\" end" | head -1)
          case "$state" in
            draft) echo "draft $TAG is there" ;;
            published)
              echo "::error::$TAG is published already, nothing is built over it"
              exit 1 ;;
            *)
              # a beta is a pre-release from its draft on
              case "$TAG" in *-beta.*) pre=--prerelease ;; *) pre= ;; esac
              gh release create "$TAG" --draft $pre --verify-tag --title "$TAG" --notes "$TAG"
              echo "made a plain draft for $TAG" ;;
          esac

  list:
    needs: draft
    uses: ./.github/workflows/releases-list.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit

  windows:
    needs: draft
    uses: ./.github/workflows/windows.yml
    with:
      signed: true
    secrets: inherit

  linux:
    needs: draft
    uses: ./.github/workflows/linux.yml
    with:
      signed: true
    secrets: inherit

  android:
    needs: draft
    uses: ./.github/workflows/android.yml
    with:
      signed: true
    secrets: inherit

  # the web version, for the public demo the website serves: notes stay in
  # each visitor's browser, nothing runs on the server
  web:
    needs: draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      # rust-toolchain.toml brings the wasm32 target
      - run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: false
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: wasm-bindgen@0.2.129
      - run: pnpm install --frozen-lockfile
      - name: build
        env:
          APP_RELEASE: '1'
        run: |
          set -eu
          pnpm --filter @app/client build:web
          version="${GITHUB_REF_NAME#v}"
          mkdir -p out
          (cd apps/client/dist-web && zip -qr "../../../out/ficelle-web-$version.zip" .)
          ls -l out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web
          path: out/
          retention-days: 7

  publish:
    needs: [list, windows, linux, android, web]
    if: >-
      ${{ !cancelled() && needs.list.result == 'success'
      && needs.windows.result == 'success' && needs.linux.result == 'success'
      && needs.android.result == 'success'
      && needs.web.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: out
      - name: latest.json, the files, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          version="${TAG#v}"
          base="https://github.com/$GH_REPO/releases/download/$TAG"
          setup=$(find out -name '*_x64-setup.exe' | head -1)
          portable=$(find out -name '*_x64_portable.exe' | head -1)
          appimage=$(find out -name '*_amd64.AppImage' | head -1)
          # the ARM builds of the same
          setup_arm=$(find out -name '*_arm64-setup.exe' | head -1)
          portable_arm=$(find out -name '*_arm64_portable.exe' | head -1)
          appimage_arm=$(find out -name '*_aarch64.AppImage' | head -1)
          apk=$(find out -name '*-android.apk' | head -1)
          webzip=$(find out -name 'ficelle-web-*.zip' | head -1)
          for file in "$setup" "$portable" "$appimage" "$setup_arm" "$portable_arm" \
            "$appimage_arm" "$apk" "$webzip"; do test -f "$file"; done
          # the line apps show and whether it fixes a security problem: apps
          # then ask in the middle of the screen, a critical update. Newer apps
          # show the messages, keys they translate, and the English list of
          # changes behind "What's changed"; older ones the line. It comes
          # from update.json on the draft, not from the servers' releases.json,
          # which only names versions with a server image
          notes=""
          critical=false
          messages="[]"
          changelog=""
          # only what the draft holds is downloaded, so a failed download stops the job
          assets=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          if grep -qx releases.json <<< "$assets"; then
            gh release download "$TAG" -p releases.json -O releases.json --clobber
          fi
          if grep -qx update.json <<< "$assets"; then
            gh release download "$TAG" -p update.json -O update.json --clobber
            notes=$(jq -r '.notes // ""' update.json)
            critical=$(jq '.critical == true' update.json)
            messages=$(jq -c '.messages // []' update.json)
            changelog=$(jq -r '.changelog // ""' update.json)
            gh release delete-asset "$TAG" update.json --yes
          fi
          # the notes database's format, its schema steps: an app going back
          # to an older version only does so when they match
          # (cargo run -p devtool -- schema says the same, without a build)
          schema=$(grep -c 'include_str!("db/' crates/core/src/db.rs)
          entry() { jq -n --arg sig "$(cat "$1.sig")" --arg url "$base/$(basename "$1")" '{signature: $sig, url: $url}'; }
          # where it stands among releases and nightlies, Android's version code
          build=$(node tools/version.mjs android-code)
          # the one APK holds every Android architecture, listed under each
          jq -n --arg version "$version" --arg notes "$notes" --argjson critical "$critical" \
            --argjson messages "$messages" --arg changelog "$changelog" \
            --argjson schema "$schema" --argjson build "$build" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson windows "$(entry "$setup")" \
            --argjson linux "$(entry "$appimage")" \
            --argjson windows_arm "$(entry "$setup_arm")" \
            --argjson linux_arm "$(entry "$appimage_arm")" \
            --argjson android "$(entry "$apk")" \
            '{version: $version, notes: $notes, messages: $messages, changelog: $changelog,
              critical: $critical, schema: $schema, build: $build, pub_date: $date, platforms: ({
              "windows-x86_64": $windows, "linux-x86_64": $linux,
              "windows-aarch64": $windows_arm, "linux-aarch64": $linux_arm,
              "android-aarch64": $android, "android-arm": $android, "android-x86_64": $android })}' \
            > latest.json
          cat latest.json
          # the signatures travel in latest.json, not on the release page
          gh release upload "$TAG" "$setup" "$portable" "$appimage" "$setup_arm" \
            "$portable_arm" "$appimage_arm" "$apk" latest.json --clobber
          case "$TAG" in
            *-beta.*) gh release edit "$TAG" --draft=false --prerelease --latest=false ;;
            *) gh release edit "$TAG" --draft=false --latest ;;
          esac
          echo "published $TAG"

          # the web version, for servers that host it, on a release of its own
          # so release pages do not offer it as a download. It follows stable
          # releases, replaced only by a newer one
          if [[ "$TAG" != *-beta.* ]]; then
            if ! gh release view web > /dev/null 2>&1; then
              gh release create web --prerelease --latest=false --title "Web version for servers" \
                --notes "The web version a server hosting it unpacks, from the newest release. Not a release of its own."
            fi
            held=$(gh release view web --json assets --jq '.assets[].name' | sed -n 's/^ficelle-web-\(.*\)\.zip$/\1/p' | head -1)
            if node tools/version.mjs newer "$version" "$held"; then
              gh release upload web "$webzip" --clobber
              for old in $(gh release view web --json assets --jq '.assets[].name'); do
                [ "$old" = "$(basename "$webzip")" ] || gh release delete-asset web "$old" --yes
              done
              echo "the web release now holds $version (it held ${held:-nothing})"
            else
              echo "the web release keeps $held, newer than $version"
            fi
          fi

          # the Beta list: replaced when this release is newer than the one
          # it holds, so a stable fix older than the current beta leaves it
          held=""
          if gh release download beta -p latest.json -O held.json --clobber 2>/dev/null; then
            held=$(jq -r .version held.json)
          else
            gh release view beta > /dev/null 2>&1 || gh release create beta --prerelease --latest=false \
              --title "Beta channel" --notes "The update list beta apps read, not a release of its own."
          fi
          if node tools/version.mjs newer "$version" "$held"; then
            # the servers' signed list too, for servers running a beta
            if [ -f releases.json ]; then extra=releases.json; else extra=; fi
            gh release upload beta latest.json $extra --clobber
            echo "the Beta list now points at $version (it held ${held:-nothing})"
          else
            echo "the Beta list keeps $held, newer than $version"
          fi

          # the Nightly list: a stable release newer than the nightly it holds
          # takes its place, so apps on Nightly get the release at once and
          # the next nightly numbers above it. By build number, a nightly's
          # name holds none. A beta never joins it: nightlies stop at a beta
          case "$TAG" in *-beta.*) exit 0 ;; esac
          if gh release download nightly -p latest.json -O nightly-held.json --clobber 2>/dev/null; then
            held=$(jq -r .version nightly-held.json)
            if [ "$build" -gt "$(jq -r '.build // 0' nightly-held.json)" ]; then
              gh release upload nightly latest.json --clobber
              echo "the Nightly list now points at $version (it held $held)"
            else
              echo "the Nightly list keeps $held, newer than $version"
            fi
          fi
