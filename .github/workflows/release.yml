name: release

# A release, from its tag: the Windows, Linux and Android apps built at
# once, each signed for the app updater with the TAURI_SIGNING_PRIVATE_KEY
# secret, attached to a draft release with one latest.json for all, and
# only then published. Until then the release is a draft, which neither
# people nor apps see; a failed build leaves it a draft.
#
# The draft can be made beforehand, with its notes and the servers'
# releases.json, which releases-list.yml signs here; a tag pushed without one
# gets a plain draft, its notes edited on GitHub before running this again.
#
# Two channels. A stable tag vX.Y.Z becomes the latest release, the list
# stable apps read (releases/latest/download/latest.json). A beta tag
# vX.Y.Z-beta.N is a pre-release, never "latest", and also builds the Mac
# app, which follows Beta only. Beta apps read the list of the fixed "beta"
# release, which always holds the newest of either kind: every release
# newer than what it holds replaces it, so a beta app reaches the stable
# release too.

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+', 'v[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - name: the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          state=$(gh api "repos/$GH_REPO/releases" --paginate \
            --jq ".[] | select(.tag_name == \"$TAG\") | if .draft then \"draft\" else \"published\" end" | head -1)
          case "$state" in
            draft) echo "draft $TAG is there" ;;
            published)
              echo "::error::$TAG is published already, nothing is built over it"
              exit 1 ;;
            *)
              # a beta is a pre-release from its draft on
              case "$TAG" in *-beta.*) pre=--prerelease ;; *) pre= ;; esac
              gh release create "$TAG" --draft $pre --verify-tag --title "$TAG" --notes "$TAG"
              echo "made a plain draft for $TAG" ;;
          esac

  list:
    needs: draft
    uses: ./.github/workflows/releases-list.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit

  windows:
    needs: draft
    uses: ./.github/workflows/windows.yml
    with:
      signed: true
    secrets: inherit

  linux:
    needs: draft
    uses: ./.github/workflows/linux.yml
    with:
      signed: true
    secrets: inherit

  android:
    needs: draft
    uses: ./.github/workflows/android.yml
    with:
      signed: true
    secrets: inherit

  # only the tag named in the MAC_RELEASE repository variable: the Mac app gets
  # one release, then major fixes, until a Mac can test it daily
  mac:
    needs: draft
    if: vars.MAC_RELEASE == github.ref_name
    uses: ./.github/workflows/mac.yml
    with:
      signed: true
    secrets: inherit

  publish:
    needs: [list, windows, linux, android, mac]
    # the Mac app is skipped for most releases
    if: >-
      ${{ !cancelled() && needs.list.result == 'success'
      && needs.windows.result == 'success' && needs.linux.result == 'success'
      && needs.android.result == 'success'
      && contains(fromJSON('["success", "skipped"]'), needs.mac.result) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: out
      - name: latest.json, the files, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          version="${TAG#v}"
          base="https://github.com/$GH_REPO/releases/download/$TAG"
          setup=$(find out -name '*-setup.exe' | head -1)
          portable=$(find out -name '*_portable.exe' | head -1)
          appimage=$(find out -name '*.AppImage' | head -1)
          apk=$(find out -name '*.apk' | head -1)
          for file in "$setup" "$portable" "$appimage" "$apk"; do test -f "$file"; done
          # the Mac app, when built: the .dmg to download, the archive it updates from
          mapfile -t dmgs < <(find out -name '*.dmg')
          macapp=$(find out -name '*.app.tar.gz' | head -1)
          mac=null
          macfiles=()
          if [ -n "$macapp" ]; then
            mac=$(jq -n --arg sig "$(cat "$macapp.sig")" --arg url "$base/$(basename "$macapp")" '{signature: $sig, url: $url}')
            macfiles=("$macapp")
          fi
          # the line apps show and whether it fixes a security problem: apps
          # then ask in the middle of the screen, a critical update. It comes
          # from update.json on the draft, not from the servers' releases.json,
          # which only names versions with a server image
          notes=""
          critical=false
          # only what the draft holds is downloaded, so a failed download stops the job
          assets=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          if grep -qx releases.json <<< "$assets"; then
            gh release download "$TAG" -p releases.json -O releases.json --clobber
          fi
          if grep -qx update.json <<< "$assets"; then
            gh release download "$TAG" -p update.json -O update.json --clobber
            notes=$(jq -r '.notes // ""' update.json)
            critical=$(jq '.critical == true' update.json)
            gh release delete-asset "$TAG" update.json --yes
          fi
          # the notes database's format, its schema steps: an app going back
          # to an older version only does so when they match
          # (cargo run -p devtool -- schema says the same, without a build)
          schema=$(grep -c 'include_str!("db/' crates/core/src/db.rs)
          entry() { jq -n --arg sig "$(cat "$1.sig")" --arg url "$base/$(basename "$1")" '{signature: $sig, url: $url}'; }
          # the one APK holds every Android architecture, listed under each
          jq -n --arg version "$version" --arg notes "$notes" --argjson critical "$critical" \
            --argjson schema "$schema" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson windows "$(entry "$setup")" \
            --argjson linux "$(entry "$appimage")" \
            --argjson android "$(entry "$apk")" \
            --argjson mac "$mac" \
            '{version: $version, notes: $notes, critical: $critical, schema: $schema, pub_date: $date, platforms: ({
              "windows-x86_64": $windows, "linux-x86_64": $linux,
              "android-aarch64": $android, "android-arm": $android, "android-x86_64": $android }
              + (if $mac then {"macos-aarch64": $mac, "macos-x86_64": $mac} else {} end))}' \
            > latest.json
          cat latest.json
          # the signatures travel in latest.json, not on the release page
          gh release upload "$TAG" "$setup" "$portable" "$appimage" "$apk" "${dmgs[@]}" "${macfiles[@]}" latest.json --clobber
          case "$TAG" in
            *-beta.*) gh release edit "$TAG" --draft=false --prerelease --latest=false ;;
            *) gh release edit "$TAG" --draft=false --latest ;;
          esac
          echo "published $TAG"

          # the Beta list: replaced when this release is newer than the one
          # it holds, so a stable fix older than the current beta leaves it
          held=""
          if gh release download beta -p latest.json -O held.json --clobber 2>/dev/null; then
            held=$(jq -r .version held.json)
          else
            gh release view beta > /dev/null 2>&1 || gh release create beta --prerelease --latest=false \
              --title "Beta channel" --notes "The update list beta apps read, not a release of its own."
          fi
          if node tools/version.mjs newer "$version" "$held"; then
            # the servers' signed list too, for servers running a beta
            if [ -f releases.json ]; then extra=releases.json; else extra=; fi
            gh release upload beta latest.json $extra --clobber
            echo "the Beta list now points at $version (it held ${held:-nothing})"
          else
            echo "the Beta list keeps $held, newer than $version"
          fi
