name: windows

# The Windows installer and portable exe. release.yml calls it for each
# release, the installer signed for the app updater with the
# TAURI_SIGNING_PRIVATE_KEY secret, so the update key never has to sit on a
# computer, and attaches both. A manual run builds an unsigned installer and
# portable exe of the chosen branch, kept as an artifact for a week.

on:
  workflow_call:
    inputs:
      signed:
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      # OpenSSL, built from source for SQLCipher, needs a full Perl: Git's,
      # first in bash's path, lacks modules it uses
      PERL: C:\Strawberry\perl\bin\perl.exe
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      # rust-toolchain.toml selects the version and components
      - run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # the client carries the e2ee code as WebAssembly, see tools/wasm.mjs
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: wasm-bindgen@0.2.129
      - run: pnpm install --frozen-lockfile

      - name: build, signed
        if: inputs.signed
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::the TAURI_SIGNING_PRIVATE_KEY secret is missing"
            exit 1
          fi
          node tools/build-release.mjs
      - name: build, unsigned
        if: ${{ !inputs.signed }}
        run: node tools/build-release.mjs --unsigned
      # after the installer: both use target/release/ficelle.exe
      - name: portable exe
        run: node tools/build-release.mjs --portable

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: |
            target/release/bundle/nsis/*-setup.exe
            target/release/bundle/nsis/*-setup.exe.sig
            target/release/bundle/portable/*_portable.exe
          retention-days: 7
