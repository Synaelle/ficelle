name: image

# The server image on ghcr.io. A tag vX.Y.Z publishes X.Y.Z, X.Y, X and
# latest. Each night the default branch publishes main, for the staging
# instance, when it has new commits. Each image carries its SBOM and build
# provenance, and is signed with cosign by this workflow's own GitHub
# identity, no key to keep: deploy/update/server-update checks it.

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  # the signature's identity: this workflow, from GitHub's OIDC
  id-token: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # first, the nightly check reads the published main image
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: what to publish
        id: plan
        run: |
          set -eu
          # brand.json names the image, ghcr wants it lowercase
          image=$(jq -r .dockerImage packages/brand/brand.json | tr '[:upper:]' '[:lower:]')
          revision=$(git rev-parse HEAD)
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "commit=$revision" >> "$GITHUB_OUTPUT"
          echo "date=$(git show -s --format=%cs HEAD)" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version=${GITHUB_REF_NAME#v}
            workspace=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
            if [ "$version" != "$workspace" ]; then
              echo "the tag says $version, Cargo.toml says $workspace" >&2
              exit 1
            fi
            major=${version%%.*}
            minor=${version#*.}
            minor=${minor%%.*}
            {
              echo "channel=release"
              echo "version=$version"
              echo "tags<<EOF"
              echo "$image:$version"
              echo "$image:$major.$minor"
              echo "$image:$major"
              echo "$image:latest"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            # main is made again only when the branch moved
            published=$(docker buildx imagetools inspect "$image:main" \
              --format '{{ index .Image.Config.Labels "org.opencontainers.image.revision" }}' 2>/dev/null || true)
            if [ "$published" = "$revision" ] && [ "$GITHUB_EVENT_NAME" = schedule ]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
            fi
            {
              echo "channel=preview"
              # the release it is based on, then the commit
              base=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
              echo "version=preview-$base-$(git rev-parse --short=9 HEAD)"
              echo "tags=$image:main"
            } >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.plan.outputs.skip != 'true'
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        if: steps.plan.outputs.skip != 'true'
        with:
          context: .
          # next to the other server files, its ignore list beside it
          file: deploy/Dockerfile
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.plan.outputs.tags }}
          build-args: |
            CHANNEL=${{ steps.plan.outputs.channel }}
            COMMIT=${{ steps.plan.outputs.commit }}
            COMMIT_DATE=${{ steps.plan.outputs.date }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.plan.outputs.commit }}
            org.opencontainers.image.version=${{ steps.plan.outputs.version }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later
          cache-from: type=gha,scope=${{ steps.plan.outputs.channel }}
          cache-to: type=gha,mode=max,scope=${{ steps.plan.outputs.channel }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: steps.plan.outputs.skip != 'true'
      - name: sign
        if: steps.plan.outputs.skip != 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ steps.plan.outputs.image }}
        run: |
          cosign sign --yes "$IMAGE@$DIGEST"
          # the check deploy/update/server-update makes, before anyone does
          cosign verify \
            --certificate-identity-regexp "^${{ github.server_url }}/${{ github.repository }}/.github/workflows/image.yml@" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$IMAGE@$DIGEST" > /dev/null
          echo "signed and checked: $IMAGE@$DIGEST"
      - name: the image starts and answers
        if: steps.plan.outputs.skip != 'true'
        run: |
          set -eu
          image=$(echo '${{ steps.plan.outputs.tags }}' | head -n1)
          docker run -d --name check -p 127.0.0.1:8080:8080 "$image"
          for _ in $(seq 30); do
            if curl -fsS http://127.0.0.1:8080/health; then
              docker rm -f check
              exit 0
            fi
            sleep 2
          done
          docker logs check
          exit 1
