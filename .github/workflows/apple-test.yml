name: apple-test

# An untested iOS build, for people with an iPhone or iPad willing to try
# it. Run by hand: it builds main as a preview (the yellow knot, no app
# updater), unsigned, and replaces the file of the single pre-release
# "apple-test". A pre-release is never the latest release, so the apps'
# update check never sees it. docs/apple.md says how to install it. The Mac
# app is to come with the Beta releases instead.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apple-test
  cancel-in-progress: false

jobs:
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: rustup show
      - run: rustup target add aarch64-apple-ios
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: wasm-bindgen@0.2.129
      - run: pnpm install --frozen-lockfile
      # the Xcode project is made here each time, the repository keeps none
      # until the iOS app is looked after for real
      - name: xcode project
        working-directory: apps/client
        run: |
          set -eu
          jq -s '.[0] * .[1]' src-tauri/tauri.release.conf.json src-tauri/tauri.preview.conf.json \
            | jq '.bundle.createUpdaterArtifacts = false' > "$RUNNER_TEMP/apple.json"
          echo "TAURI_CONFIG=$(jq -c . "$RUNNER_TEMP/apple.json")" >> "$GITHUB_ENV"
          TAURI_CONFIG="$(jq -c . "$RUNNER_TEMP/apple.json")" pnpm tauri ios init --ci
          # signing off in the project itself: tauri does not pass build
          # settings on to xcodebuild, and an unsigned app needs no team
          project=$(ls -d src-tauri/gen/apple/*.xcodeproj | head -n1)
          sed -i '' 's/buildSettings = {/buildSettings = { CODE_SIGNING_ALLOWED = NO; CODE_SIGNING_REQUIRED = NO; CODE_SIGN_IDENTITY = ""; DEVELOPMENT_TEAM = "";/' \
            "$project/project.pbxproj"
          grep -c 'CODE_SIGNING_ALLOWED = NO' "$project/project.pbxproj"
      - name: build, unsigned
        working-directory: apps/client
        env:
          APP_PREVIEW: '1'
        run: |
          set -u
          # Xcode's build step needs tauri ios build running beside it, so
          # tauri drives the build, with signing off. Its export to an .ipa
          # needs signing and fails: the app is taken from the archive
          pnpm tauri ios build --ci -- CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            || echo "tauri ios build ended with an error, looking for the app in the archive"
          app=$(find src-tauri/gen/apple "$HOME/Library/Developer/Xcode" -maxdepth 8 \
            -path '*.xcarchive/Products/Applications/*.app' 2>/dev/null | head -n1)
          if [ -z "$app" ]; then
            echo "::error::no app was built"
            exit 1
          fi
          echo "app: $app"
          # an unsigned .ipa: the app in a Payload folder, zipped
          mkdir -p "$RUNNER_TEMP/ipa/Payload" ../../out
          cp -R "$app" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/out/ficelle-apple-test-ios.ipa" Payload)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios
          path: out/ficelle-apple-test-ios.ipa
          retention-days: 7

  publish:
    needs: [ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: out
          merge-multiple: true
      - name: the apple-test pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          ls -l out
          # made again each time, at this commit, with only the newest files
          gh release delete apple-test --cleanup-tag --yes 2>/dev/null || true
          gh release create apple-test out/* --prerelease --latest=false \
            --target "$GITHUB_SHA" --title "iOS test build (untested)" \
            --notes "An untested build for iPhone and iPad, from $(date -u +%F), commit ${GITHUB_SHA::7}. It may not start at all. How to install it, and how to help: https://github.com/${GH_REPO}/blob/main/docs/apple.md"
