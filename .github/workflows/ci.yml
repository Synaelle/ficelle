name: ci

# text-only changes cannot break the build, they skip it. Pushes to main
# only: a tag names a commit main already checked, and a pull request's
# branch is checked once, as the pull request
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'LICENSE']
  pull_request:
    paths-ignore: ['**.md', 'LICENSE']

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # whether this push or pull request touched Rust: without it the Rust
  # checks and tests are skipped, they cannot have changed
  changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.diff.outputs.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          base=${BASE:-$BEFORE}
          # a new branch or tag, or a base no longer there: everything runs
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$base" HEAD | grep -qE '^(crates/|apps/server/|apps/client/src-tauri/|Cargo\.|rust-toolchain\.toml|deny\.toml|\.github/workflows/ci\.yml)'; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
          else
            echo "rust=false" >> "$GITHUB_OUTPUT"
          fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      # the web pages carry the e2ee client as WebAssembly, see tools/wasm.mjs
      - run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # only main saves: caches made on tags and other branches are
          # unreadable from main and push its own out of the 10 GB limit
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2.89.1
        with:
          tool: wasm-bindgen@0.2.129
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm -r --if-present test

  # licences that fit the AGPL and crates.io only (deny.toml); advisories run
  # on their own schedule in advisories.yml, so a new one published upstream
  # does not fail every push and stop the nightly
  deny:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check bans licenses sources

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    # 26.04 asks for amd64v3 packages the mirrors do not serve well yet
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: tauri linux deps
        # a stuck package mirror fails the step instead of holding the run for an hour
        timeout-minutes: 10
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y libwebkit2gtk-4.1-dev librsvg2-dev
      # rust-toolchain.toml selects the version and components
      - run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # only main saves: caches made on tags and other branches are
          # unreadable from main and push its own out of the 10 GB limit
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # the apps' Windows-only code; installers come from the nightly and the
  # release, a release-profile build here took long for nothing kept
  windows:
    needs: [lint, rust]
    # after the Rust tests, or without them when no Rust changed
    if: ${{ !cancelled() && needs.lint.result == 'success' && contains(fromJSON('["success", "skipped"]'), needs.rust.result) }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # only main saves: caches made on tags and other branches are
          # unreadable from main and push its own out of the 10 GB limit
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy -p client --all-targets -- -D warnings
