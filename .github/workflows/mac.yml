name: mac

# One macOS app for Apple Silicon and Intel, as an unsigned .dmg, and the same
# app as an archive signed for the app updater. release.yml calls it for every
# release. Without an Apple signing account the app is signed ad hoc and not
# notarised. A manual run builds the chosen branch, kept as an artifact
# for a week, signed for the updater if asked. No Mac is at hand to try the
# update on, so the steps here run what can be checked on the runner.

on:
  workflow_call:
    inputs:
      signed:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      signed:
        description: Signed for the app updater too
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      # rust-toolchain.toml selects the version and components; the Intel half
      # is cross-built on the Apple Silicon runner
      - run: |
          rustup show
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: universal-apple-darwin
          # only main saves: caches made on tags and other branches are
          # unreadable from main and push its own out of the 10 GB limit
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # the client carries the e2ee code as WebAssembly, see tools/wasm.mjs
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: wasm-bindgen@0.2.129
      - run: pnpm install --frozen-lockfile
      - name: build
        run: node tools/build-release.mjs --unsigned -- --target universal-apple-darwin --bundles app,dmg
      - name: the app holds both kinds of Mac, and its signature holds
        run: |
          set -eu
          app=target/universal-apple-darwin/release/bundle/macos/Ficelle.app
          slug=$(jq -r .slug packages/brand/brand.json)
          archs=$(lipo -archs "$app/Contents/MacOS/$slug")
          echo "$archs"
          echo "$archs" | grep -q x86_64
          echo "$archs" | grep -q arm64
          codesign --verify --deep --strict --verbose=2 "$app"
      # the running app replaced by a new one, only a Mac can run this
      - name: the update's swap
        run: cargo test -p client --lib mac_app
      - name: the archive the app updates itself from
        if: inputs.signed
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -eu
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::the TAURI_SIGNING_PRIVATE_KEY secret is missing"
            exit 1
          fi
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          mkdir -p out
          name="Ficelle_${version}_universal.app.tar.gz"
          # no ._ files beside the app's own
          COPYFILE_DISABLE=1 tar -czf "out/$name" \
            -C target/universal-apple-darwin/release/bundle/macos Ficelle.app
          # the version in the signature, which the app checks
          pnpm --filter @app/client tauri signer sign --app-version "$version" "$PWD/out/$name"
          test -f "out/$name.sig"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mac-universal
          path: |
            target/universal-apple-darwin/release/bundle/dmg/*.dmg
            out/*
          if-no-files-found: error
          retention-days: 7
