name: linux

# The Linux AppImage, built on the oldest supported Ubuntu (its glibc is the
# oldest the AppImage runs on). release.yml calls it for each release, signed
# for the app updater with the TAURI_SIGNING_PRIVATE_KEY secret, and attaches
# it. nightly.yml calls it with a nightly's name and build number. A manual
# run builds an unsigned AppImage of the chosen branch, kept as an artifact
# for a week.

on:
  workflow_call:
    inputs:
      signed:
        type: boolean
        default: false
      # a nightly: its name (nightly-2026-11-16) and build number
      nightly:
        type: string
        default: ''
      build:
        type: string
        default: ''
  workflow_dispatch:

permissions:
  contents: read

jobs:
  appimage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: tauri linux deps
        # a stuck package mirror fails the step instead of holding the run for an hour
        timeout-minutes: 10
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev file
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      # rust-toolchain.toml selects the version and components
      - run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # only main saves: caches made on tags and other branches are
          # unreadable from main and push its own out of the 10 GB limit
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: pnpm install --frozen-lockfile

      - name: build, signed
        if: inputs.signed
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APP_NIGHTLY: ${{ inputs.nightly }}
          APP_BUILD: ${{ inputs.build }}
        run: |
          set -eu
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::the TAURI_SIGNING_PRIVATE_KEY secret is missing"
            exit 1
          fi
          node tools/build-release.mjs -- --bundles appimage
          if [ -n "$APP_NIGHTLY" ]; then
            # the bundler named and signed it for the release number: a
            # nightly's file carries its own name, signed for it
            dir=target/release/bundle/appimage
            built=$(ls "$dir"/*.AppImage | head -1)
            name="$(jq -r .displayName packages/brand/brand.json | tr ' ' '-')_${APP_NIGHTLY}_amd64.AppImage"
            rm -f "$dir"/*.AppImage.sig
            mv "$built" "$dir/$name"
            pnpm --filter @app/client tauri signer sign --app-version "$APP_NIGHTLY" "$PWD/$dir/$name"
            test -f "$dir/$name.sig"
          fi
      - name: build, unsigned
        if: ${{ !inputs.signed }}
        run: node tools/build-release.mjs --unsigned -- --bundles appimage

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: appimage
          path: |
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/appimage/*.AppImage.sig
          retention-days: 7
