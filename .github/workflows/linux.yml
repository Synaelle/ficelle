name: linux

# The Linux AppImage, for x86_64 and for aarch64 (each on its own kind of
# runner), built inside an Ubuntu 22.04 container: its glibc is the oldest
# the AppImage runs on, and the build no longer depends on GitHub keeping
# runners of that Ubuntu. release.yml calls it for each release, signed
# for the app updater with the TAURI_SIGNING_PRIVATE_KEY secret, and attaches
# it. nightly.yml calls it with a nightly's name and build number. A manual
# run builds an unsigned AppImage of the chosen branch, kept as an artifact
# for a week.
#
# A release, or a manual run, also makes the Arch Linux package from the
# x86_64 AppImage's own program, desktop entry and icons (tools/arch). It is
# signed like the AppImage, the app updates it with pacman. Never a
# nightly's: packages come only from stable releases.

on:
  workflow_call:
    inputs:
      signed:
        type: boolean
        default: false
      # a nightly: its name (nightly-2026-11-16) and build number
      nightly:
        type: string
        default: ''
      build:
        type: string
        default: ''
  workflow_dispatch:

permissions:
  contents: read

jobs:
  appimage:
    strategy:
      matrix:
        # a nightly is x86_64 only, a release also builds aarch64
        include: ${{ fromJSON(inputs.nightly != '' && '[{"runner":"ubuntu-24.04","arch":"amd64"}]' || '[{"runner":"ubuntu-24.04","arch":"amd64"},{"runner":"ubuntu-24.04-arm","arch":"aarch64"}]') }}
    runs-on: ${{ matrix.runner }}
    container: ubuntu:22.04@sha256:f64b2ffc2f10ab8f8505aa56b2664bd846cbb9df87c7e2532e30f7667021c0e6
    env:
      DEBIAN_FRONTEND: noninteractive
      # no FUSE in a container: the bundler's own AppImage tools unpack themselves
      APPIMAGE_EXTRACT_AND_RUN: '1'
    steps:
      - name: tauri linux deps
        # a stuck package mirror fails the step instead of holding the run for an hour
        timeout-minutes: 10
        run: |
          apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends \
            ca-certificates curl git jq zstd file build-essential pkg-config perl \
            libwebkit2gtk-4.1-dev librsvg2-dev
      # git first, so checkout makes a real clone the version script can read
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: rustup
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      # Node before pnpm: the container has none, and pnpm's setup needs npm
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      # rust-toolchain.toml selects the version and components
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # only main saves: caches made on tags and other branches are
          # unreadable from main and push its own out of the 10 GB limit
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: pnpm install --frozen-lockfile

      - name: build, signed
        if: inputs.signed
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APP_NIGHTLY: ${{ inputs.nightly }}
          APP_BUILD: ${{ inputs.build }}
        run: |
          set -eu
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::the TAURI_SIGNING_PRIVATE_KEY secret is missing"
            exit 1
          fi
          node tools/build-release.mjs -- --bundles appimage
          if [ -n "$APP_NIGHTLY" ]; then
            # the bundler named and signed it for the release number: a
            # nightly's file carries its own name, signed for it
            dir=target/release/bundle/appimage
            built=$(ls "$dir"/*.AppImage | head -1)
            name="$(jq -r .displayName packages/brand/brand.json | tr ' ' '-')_${APP_NIGHTLY}_${{ matrix.arch }}.AppImage"
            rm -f "$dir"/*.AppImage.sig
            mv "$built" "$dir/$name"
            pnpm --filter @app/client tauri signer sign --app-version "$APP_NIGHTLY" "$PWD/$dir/$name"
            test -f "$dir/$name.sig"
          fi
      - name: build, unsigned
        if: ${{ !inputs.signed }}
        run: node tools/build-release.mjs --unsigned -- --bundles appimage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: appimage-${{ matrix.arch }}
          path: |
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/appimage/*.AppImage.sig
          retention-days: 7
      - name: the arch package's files
        if: matrix.arch == 'amd64' && inputs.nightly == ''
        run: |
          set -eu
          from=$(ls -d target/release/bundle/appimage/*.AppDir/usr | head -1)
          mkdir -p target/arch-files/usr/share
          cp -r "$from/bin" target/arch-files/usr/
          cp -r "$from/share/applications" "$from/share/icons" target/arch-files/usr/share/
          find target/arch-files -type f
      - if: matrix.arch == 'amd64' && inputs.nightly == ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: arch-files
          path: target/arch-files/
          retention-days: 1

  # makepkg runs in an Arch container (tools/arch/build.sh), the signing on
  # the runner, where the Tauri CLI is
  arch:
    needs: appimage
    if: inputs.nightly == ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: arch-files
          path: target/arch-files
      - name: the package
        timeout-minutes: 15
        run: |
          set -eu
          version=$(APP_RELEASE=1 node tools/version.mjs | cut -d' ' -f1)
          tools/arch/build.sh target/arch-files "$version"
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: inputs.signed
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: inputs.signed
        with:
          node-version: 24
          cache: pnpm
      - name: signed
        if: inputs.signed
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -eu
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::the TAURI_SIGNING_PRIVATE_KEY secret is missing"
            exit 1
          fi
          pnpm install --frozen-lockfile
          package=$(ls "$PWD"/target/arch/*.pkg.tar.zst)
          pnpm --filter @app/client tauri signer sign "$package"
          test -f "$package.sig"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: arch-package
          path: |
            target/arch/*.pkg.tar.zst
            target/arch/*.pkg.tar.zst.sig
          retention-days: 7
