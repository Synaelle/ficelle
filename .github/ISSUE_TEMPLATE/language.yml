name: New language
description: Ask for Ficelle in a language it does not speak yet
body:
  - type: markdown
    attributes:
      value: |
        Ask here for a new language first. Once it is added, anyone can translate it on GitHub, and it shows in the app once half of it is translated.

        I write English and French myself. Other languages are translated and kept up to date by the people who speak them.
  - type: input
    id: language
    attributes:
      label: Language
      description: Its name, and its code if you know it (pl, zh-TW).
      placeholder: Polish
    validations:
      required: true
  - type: dropdown
    id: helping
    attributes:
      label: Would you translate it?
      options:
        - Yes, I would translate it
        - I can help with part of it
        - No, I would like to use it
    validations:
      required: true
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: For example a regional variant, or words that need care in this language.
