[package]
name = "client"
version.workspace = true
description = "Desktop and mobile client shell"
license = "AGPL-3.0-or-later"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
# mobile targets load the app as a library, desktop links it into main.rs
name = "client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
app-brand.workspace = true
app-core.workspace = true
app-e2ee = { path = "../../../crates/e2ee" }
app-peer = { path = "../../../crates/peer" }
app-protocol.workspace = true
app-repo.workspace = true
# the fingerprint plugin passes data as text, update signatures come as text
base64 = "0.23.1"
# checks the app files an update downloads, see commands/updates.rs
minisign-verify = "0.3.0"
serde.workspace = true
serde_json.workspace = true
tauri.workspace = true
tauri-plugin-clipboard-manager = "2.5.0"
tauri-plugin-dialog = "2.8.3"
tauri-plugin-fs = "2.7.1"
tauri-plugin-notification = "2.8.0"
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
ureq = { version = "3.5.0", features = ["json"] }
zeroize = "1.9.1"

# fingerprint unlock through the Android Keystore
[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-biometric = "2.5.0"
# vibration for touch gestures
tauri-plugin-haptics = "2.4.2"

# the quick note window opens from a shortcut that works in any app
[target.'cfg(not(target_os = "android"))'.dependencies]
tauri-plugin-global-shortcut = "2.4.1"
# encodes a picture pasted from the clipboard, and the AppImage's icon on Linux
png = "0.18.1"

# Linux: GTK's program name is the app id Wayland compositors match a window's
# icon by
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18.2"

# Windows Hello unlock goes through WinRT, the official bindings with only
# the credential and buffer APIs enabled; winsafe (safe Win32 calls) brings
# its prompt forward
[target.'cfg(windows)'.dependencies]
app-webview-memory = { path = "../../../crates/webview-memory" }
windows = { version = "0.62.2", features = [
  "Foundation",
  "Globalization",
  "Globalization_DateTimeFormatting",
  "Security_Credentials",
  "Security_Cryptography",
  "Storage_Streams",
] }
winsafe = { version = "0.0.29", features = ["user"] }

[lints]
workspace = true
