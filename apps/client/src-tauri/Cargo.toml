[package]
name = "client"
version.workspace = true
description = "Desktop and mobile client shell"
license = "AGPL-3.0-or-later"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
# mobile targets load the app as a library, desktop links it into main.rs
name = "client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
app-brand.workspace = true
app-core.workspace = true
app-e2ee = { path = "../../../crates/e2ee" }
app-protocol.workspace = true
# the fingerprint plugin passes data as text, update signatures come as text
base64 = "0.23.1"
# names of the fonts installed on the device, for the note and code fonts
fontdb = { version = "0.24.0", default-features = false, features = ["std", "fs"] }
# checks the app files an update downloads, see commands/updates.rs
minisign-verify = "0.3.0"
serde.workspace = true
serde_json.workspace = true
tauri.workspace = true
tauri-plugin-clipboard-manager = "2.5.0"
tauri-plugin-dialog = "2.8.3"
tauri-plugin-fs = "2.7.1"
# vibration for touch gestures, a no-op on desktop
tauri-plugin-haptics = "2.4.2"
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
ureq = { version = "3.5.0", features = ["json"] }
zeroize = "1.9.1"

# fingerprint unlock through the Android Keystore
[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-biometric = "2.5.0"

# the quick note window opens from a shortcut that works in any app
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2.4.1"

# Windows Hello unlock goes through WinRT, the official bindings with only
# the credential and buffer APIs enabled; winsafe (safe Win32 calls) brings
# its prompt forward
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
  "Foundation",
  "Globalization",
  "Globalization_DateTimeFormatting",
  "Security_Credentials",
  "Security_Cryptography",
  "Storage_Streams",
  "UI",
  "UI_ViewManagement",
] }
winsafe = { version = "0.0.29", features = ["user"] }

[lints]
workspace = true
