[package]
name = "server"
version.workspace = true
description = "Self-hosted sync server"
license = "AGPL-3.0-or-later"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# the binary name comes from brand.json, see tools/brand.mjs
[[bin]]
name = "ficelle-server"
path = "src/main.rs"

[dependencies]
app-brand.workspace = true
app-e2ee = { path = "../../crates/e2ee" }
app-protocol.workspace = true
# backups of the instance
app-repo.workspace = true
argon2 = "0.6.0"
axum = { workspace = true, features = ["ws"] }
base64 = "0.23.1"
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc"] }
data-encoding = "2.11.1"
# signatures of the release list
ed25519-dalek = "2.2.0"
futures-core = "0.3.34"
getrandom = "0.4.3"
hmac = "0.13.0"
# fetches the release list and passes feedback on to the main instance
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls"] }
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
serde.workspace = true
serde_json.workspace = true
sha1 = "0.11.0"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { workspace = true, features = ["fs", "sync", "time", "io-util"] }
toml = "1.1.8"
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["json"] }
uuid = { version = "1.28.0", features = ["v7"] }
zeroize = "1.9.1"
url = "2"
webauthn-rs = { version = "0.6.2", features = ["danger-allow-state-serialisation", "conditional-ui"] }
rpassword = "7.5.4"

# plain SQLite: the server's databases are not encrypted with a key. Built
# with the rest of the workspace, cargo unifies this with the core's
# SQLCipher, which opens plain files as well.
rusqlite = { version = "0.42.0", features = ["bundled"] }

[dev-dependencies]
app-core = { workspace = true, features = ["testing"] }
futures-util = "0.3"
tempfile = "3.27.0"
tokio-tungstenite = "0.29.0"
tower = { version = "0.5", features = ["util"] }
webauthn-authenticator-rs = { version = "0.6.2", features = ["softpasskey"] }

[lints]
workspace = true
