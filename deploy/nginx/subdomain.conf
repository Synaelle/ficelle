# The server on its own subdomain, notes.example.org, with nginx in front.
# Copy to /etc/nginx/sites-available/, link it from sites-enabled, replace
# notes.example.org everywhere and 8080 if your instance uses another port.
# certbot --nginx fills in the certificate lines, see the self-hosting guide.

# WebSocket (sync, the setup check) needs the upgrade passed on. nginx
# allows this map once: for a second instance (staging), leave it out of
# that instance's copy.
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    listen [::]:80;
    server_name notes.example.org;
    # certbot answers its challenge here, everything else moves to https
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name notes.example.org;

    ssl_certificate /etc/letsencrypt/live/notes.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/notes.example.org/privkey.pem;

    # files go up in parts of at most 8 MB, other requests are smaller:
    # 16 MB matches the server's own limit (server.max_body_mb)
    client_max_body_size 16m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # the server believes these from a trusted proxy only (127.0.0.1 by
        # default, the network's gateway in the compose files)
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # a sync socket stays open while a device is online
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        # parts go straight through instead of filling a temporary file
        proxy_request_buffering off;
    }
}
