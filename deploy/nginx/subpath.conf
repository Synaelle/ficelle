# The server under a path of a site you already serve: example.org/notes.
# Set the instance's public address to https://example.org/notes (PUBLIC_URL
# in the compose .env, or server.public_url): the server then answers under
# /notes by itself. Add the map block next to your other http-level settings
# (outside any server block), and the location blocks into the existing
# server block for example.org that listens on 443.

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    # ... your existing listen, server_name and ssl lines for example.org ...

    # /notes without the slash leads to the instance
    location = /notes {
        return 301 /notes/;
    }

    # no path after 8080: nginx passes /notes/... unchanged, which is what
    # the server expects
    location /notes/ {
        # files go up in parts of at most 8 MB, 16 MB matches the server
        client_max_body_size 16m;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_request_buffering off;
    }
}
