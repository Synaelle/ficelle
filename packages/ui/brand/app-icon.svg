<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- The knot, the icon of release and beta builds: a beta shares the release's identity, so on Linux it shares its cached icon too. No tile, so it sits on any background; the crossing is cut with a mask so nothing shows through. Source for every platform icon, run pnpm icons after editing. -->
  <defs>
    <mask id="cut" maskUnits="userSpaceOnUse" x="-100" y="-100" width="712" height="712">
      <rect x="-100" y="-100" width="712" height="712" fill="#fff"/>
      <path d="M218.9 212.8C234.3 241.7 259.8 271 288.3 293.6" fill="none" stroke="#000" stroke-width="100"/>
    </mask>
  </defs>
  <g transform="scale(1.024) translate(-6 27.5)">
    <path d="M40 340C140 340 210 320 260 250C300 195 320 130 280 110C240 90 195 120 205 175C215 230 280 300 340 325C390 345 430 340 472 340" fill="none" stroke="#E44C3E" stroke-width="52" stroke-linecap="round" mask="url(#cut)"/>
    <path d="M218.9 212.8C234.3 241.7 259.8 271 288.3 293.6" fill="none" stroke="#E44C3E" stroke-width="52" stroke-linecap="round"/>
  </g>
</svg>
