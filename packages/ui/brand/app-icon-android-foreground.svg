<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Android's adaptive icon: app-icon.svg's knot shrunk into the safe zone (the middle 61 percent, the launcher crops the rest to its own shape), over the colour in ic_launcher_background.xml. Also the monochrome layer of themed icons. Run pnpm icons after editing. -->
  <defs>
    <mask id="cut" maskUnits="userSpaceOnUse" x="-100" y="-100" width="712" height="712">
      <rect x="-100" y="-100" width="712" height="712" fill="#fff"/>
      <path d="M218.9 212.8C234.3 241.7 259.8 271 288.3 293.6" fill="none" stroke="#000" stroke-width="100"/>
    </mask>
    <mask id="shape" maskUnits="userSpaceOnUse" x="-100" y="-100" width="712" height="712">
      <path d="M40 340C140 340 210 320 260 250C300 195 320 130 280 110C240 90 195 120 205 175C215 230 280 300 340 325C390 345 430 340 472 340" fill="none" stroke="#fff" stroke-width="52" stroke-linecap="round" mask="url(#cut)"/>
      <path d="M218.9 212.8C234.3 241.7 259.8 271 288.3 293.6" fill="none" stroke="#fff" stroke-width="52" stroke-linecap="round"/>
    </mask>
  </defs>
  <g transform="translate(256 256) scale(0.6) translate(-256 -226)">
    <path d="M40 340C140 340 210 320 260 250C300 195 320 130 280 110C240 90 195 120 205 175C215 230 280 300 340 325C390 345 430 340 472 340" fill="none" stroke="#B93A2E" stroke-width="52" stroke-linecap="round" mask="url(#cut)"/>
    <path d="M218.9 212.8C234.3 241.7 259.8 271 288.3 293.6" fill="none" stroke="#B93A2E" stroke-width="52" stroke-linecap="round"/>
    <!-- the strand's underside in the darker colour: the full colour copy, moved up, shows only where it still covers the strand -->
    <g mask="url(#shape)">
      <g transform="translate(0 -15)">
        <path d="M40 340C140 340 210 320 260 250C300 195 320 130 280 110C240 90 195 120 205 175C215 230 280 300 340 325C390 345 430 340 472 340" fill="none" stroke="#E44C3E" stroke-width="52" stroke-linecap="round" mask="url(#cut)"/>
        <path d="M218.9 212.8C234.3 241.7 259.8 271 288.3 293.6" fill="none" stroke="#E44C3E" stroke-width="52" stroke-linecap="round"/>
      </g>
    </g>
  </g>
</svg>
