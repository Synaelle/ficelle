<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 50 512 350">
  <!-- app-icon.svg's knot without its tile, for light and dark pages (the README). The crossing is cut with a mask, not the tile color, so nothing dark shows on a light page. -->
