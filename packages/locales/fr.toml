# e-mails envoyés par le serveur, en texte brut
[mail]
greeting = "Bonjour {name},"
footer = "Ce message vient de {app} sur {host}. Si vous ne l’attendiez pas, vous pouvez l’ignorer."

[mail.verify]
subject = "Confirmez votre adresse e-mail"
body = "Ouvrez ce lien dans la journée pour utiliser cette adresse pour votre compte {username} :\n\n{link}\n\nAvec une adresse confirmée, vous pourrez choisir un nouveau mot de passe par e-mail si vous oubliez le vôtre."

[mail.reset]
subject = "Choisir un nouveau mot de passe"
body = "Quelqu’un a demandé à choisir un nouveau mot de passe pour votre compte {username}. Si c’était vous, ouvrez ce lien dans l’heure :\n\n{link}\n\nSi ce n’était pas vous, ignorez ce message, votre mot de passe reste tel quel."

[mail.recover]
subject = "Choisir un nouveau mot de passe avec votre code de récupération"
body = "Quelqu’un a demandé à choisir un nouveau mot de passe pour votre compte {username}. Il est chiffré de bout en bout, personne ne peut donc réinitialiser son mot de passe par e-mail : seul votre code de récupération l’ouvre. Si vous l’avez, utilisez-le ici :\n\n{link}\n\nSi ce n’était pas vous, ignorez ce message."

[mail.test]
subject = "Un e-mail de test"
body = "Cet e-mail de test a été envoyé depuis la page d’administration. Si vous le lisez, {app} sur {host} peut envoyer des e-mails : les vérifications d’adresse, les réinitialisations de mot de passe et les avis arriveront."

[mail.password]
subject = "Votre mot de passe a été changé"
body = "Le mot de passe de votre compte {username} vient d’être changé grâce à un lien envoyé à cette adresse, et tous les appareils ont été déconnectés. Si ce n’était pas vous, contactez immédiatement les personnes qui gèrent ce serveur."

[mail.code]
subject = "Votre code de connexion"
body = "Votre code pour vous connecter en tant que {username} est\n\n{code}\n\nIl est valable 10 minutes. Si vous n’êtes pas en train de vous connecter, quelqu’un a votre mot de passe : changez-le maintenant."

[mail.deletion]
subject = "Votre compte va être supprimé"
body = "Votre compte {username} sera supprimé le {date}, avec tout ce que le serveur garde pour lui. Pour le garder, connectez-vous avant cette date et annulez la suppression."

