"standard-notes" = "En Standard Notes: Preferencias, Copias de seguridad, descargue una copia de seguridad descifrada y, a continuación, seleccione ese archivo o su archivo ZIP. Los archivos adjuntos en Standard Notes no se incluyen en ella."
