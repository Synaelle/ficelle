[package]
name = "app-e2ee"
version.workspace = true
description = "End-to-end encrypted accounts: OPAQUE sign-in and the account key hierarchy, shared by the apps, the web page and the server"
license = "AGPL-3.0-or-later"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
argon2 = "0.6"
base64 = "0.23.1"
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc"] }
aead-stream = { version = "0.6.0", default-features = false, features = ["alloc"] }
hkdf = "0.13"
hpke = { version = "0.15.0", default-features = false, features = ["alloc", "getrandom", "x25519", "chacha"] }
opaque-ke = { version = "4.0.1", features = ["argon2"] }
rand = { version = "0.8", default-features = false, features = ["getrandom"] }
serde = { workspace = true }
sha2 = "0.11.1"
sha2_10 = { package = "sha2", version = "0.10" }
thiserror = "2.0.21"
zeroize = { version = "1.9.1", features = ["derive"] }

[lints]
workspace = true
