[package]
name = "app-core-web"
version.workspace = true
description = "The notes core as WebAssembly, for the web version"
license = "AGPL-3.0-or-later"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
app-core = { workspace = true, default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
# the exact version the wasm-bindgen command line tool must match
wasm-bindgen = "=0.2.129"

# the database lives in the browser's private file storage (OPFS)
[target.'cfg(target_family = "wasm")'.dependencies]
rusqlite = "0.42.0"
sqlite-wasm-rs = { version = "0.6.3", default-features = false, features = ["wasm-bindgen"] }
sqlite-wasm-vfs = { version = "0.3.0", features = ["sahpool"] }
wasm-bindgen-futures = "0.4"

[lints]
workspace = true
