[package]
name = "app-webview-memory"
version.workspace = true
description = "Asks WebView2 to use less memory, the one call the app needs that is unsafe to make"
license = "AGPL-3.0-or-later"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# not the workspace's lints: they forbid unsafe code, and every WebView2 call is.
# Everything here is the one call in src/lib.rs
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39.1"
windows-core = "0.62.2"
