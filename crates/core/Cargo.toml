[package]
name = "app-core"
version.workspace = true
description = "Models, storage, crypto and sync engine shared by every client"
license = "AGPL-3.0-or-later"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = ["os-keyring"]
# desktop secure storage through the platform keychain, mobile platforms
# provide their own KeyStore from the client shell
os-keyring = ["dep:keyring"]
# helpers for tests that drive several devices, used by the server tests
testing = []

[dependencies]
# the official catalog's signatures, the version the server has already
app-brand = { workspace = true }
app-e2ee = { path = "../e2ee" }
app-protocol = { workspace = true }
app-repo = { workspace = true }
argon2 = { version = "0.6.0", default-features = false, features = ["alloc"] }
base64 = "0.23.1"
chacha20poly1305 = "0.11.0"
ed25519-dalek = "2.2.0"
flate2 = "1.1.10"
getrandom = "0.4.3"
hmac = "0.13.0"
jiff = { version = "0.2.38", default-features = false, features = ["std"] }
keyring = { version = "4.2.0", optional = true }
loro = "1.17.1"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.11.1"
tar = { version = "0.4.46", default-features = false }
tempfile = "3.27.0"
thiserror = "2.0.21"
uuid = { version = "1.28.0", features = ["v7", "serde"] }
zeroize = { version = "1.9.1", features = ["derive"] }
zip = { version = "=9.1.3", default-features = false, features = ["deflate-flate2"] }

# SQLCipher everywhere. Apple targets use the system crypto (CommonCrypto),
# the others build OpenSSL from source so no system library is needed.
[target.'cfg(target_vendor = "apple")'.dependencies]
rusqlite = { version = "0.40.2", features = ["bundled-sqlcipher"] }

[target.'cfg(not(target_vendor = "apple"))'.dependencies]
rusqlite = { version = "0.40.2", features = ["bundled-sqlcipher-vendored-openssl"] }

[dev-dependencies]
app-repo = { workspace = true, features = ["testing"] }

[lints]
workspace = true
